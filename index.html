<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA — Logical Universal Navigation Assistant</title>
  
  <!-- MediaPipe Face Detection Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(56, 189, 248, 0.18);
      --accent-cyan: #38bdf8;
      --accent-blue: #6366f1;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --accent-purple: #a855f7;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      color: var(--text-main);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .kiosk-shell {
      width: 100%;
      max-width: 920px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 50px rgba(56, 189, 248, 0.08);
      position: relative;
      overflow: hidden;
    }

    .kiosk-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
    }

    /* System Status Bar Header */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .dept-badge {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .system-state {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-sub);
    }

    .state-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    .state-dot.active {
      background: var(--accent-emerald);
      box-shadow: 0 0 12px var(--accent-emerald);
    }

    .state-dot.listening {
      background: var(--accent-cyan);
      box-shadow: 0 0 14px var(--accent-cyan);
      animation: pulse-ring 1.4s infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .hero-branding {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #ffffff 20%, #38bdf8 60%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      text-transform: uppercase;
      margin-left: 12px; /* Visual centering adjustment for wide tracking */
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.3));
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 3px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .visualizer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 28px;
    }

    #visualizerCanvas {
      width: 180px;
      height: 180px;
    }

    .visualizer-status {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Quick Query Chips */
    .quick-chips {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chip-btn:hover {
      background: var(--accent-glow);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .input-bar {
      display: flex;
      gap: 10px;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 6px;
      transition: all 0.25s ease;
    }

    .input-bar:focus-within {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 20px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0 22px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-execute {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      font-weight: 700;
      border: none;
    }

    .btn-execute:hover {
      opacity: 0.95;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.4);
      transform: scale(1.02);
    }

    /* Output and Dynamic Map Overlay Panels */
    .output-panel {
      margin-top: 24px;
      background: rgba(3, 7, 18, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 24px;
      display: none;
      animation: slideUp 0.35s ease-out;
    }

    .output-header {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .output-text {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-main);
      font-weight: 400;
    }

    .map-panel {
      margin-top: 18px;
      background: rgba(3, 7, 18, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      display: none;
      animation: slideUp 0.4s ease-out;
    }

    .map-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #webcam { display: none; }
  </style>
</head>
<body>

<div class="kiosk-shell">
  <!-- Header System Metadata -->
  <div class="status-bar">
    <span class="dept-badge">// CSE DEPT • KIOSK V3.0</span>
    <div class="system-state">
      <div id="stateDot" class="state-dot"></div>
      <span id="stateText">LUNA STANDBY</span>
    </div>
  </div>

  <!-- Hero Branding -->
  <div class="hero-branding">
    <h1 class="brand-title">LUNA</h1>
    <p class="brand-subtitle">LOGICAL UNIVERSAL NAVIGATION ASSISTANT</p>
  </div>

  <!-- Interactive Visualizer Orb -->
  <div class="visualizer-wrapper">
    <canvas id="visualizerCanvas" width="360" height="360"></canvas>
    <div id="visualizerStatus" class="visualizer-status">SCANNING FOR APPROACHING VISITORS</div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>

  <!-- Quick Query Action Chips -->
  <div class="quick-chips">
    <button class="chip-btn" onclick="quickAsk('Who are you?')">✨ Who is Luna?</button>
    <button class="chip-btn" onclick="quickAsk('Where is HOD office?')">📍 HOD Office</button>
    <button class="chip-btn" onclick="quickAsk('Where is Dr. Smith?')">👨‍🏫 Dr. Smith</button>
    <button class="chip-btn" onclick="quickAsk('Where is Software Lab 1?')">💻 Software Lab 1</button>
    <button class="chip-btn" onclick="quickAsk('Where are the restrooms?')">🚻 Restrooms</button>
  </div>

  <!-- Command Input Area -->
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask Luna who she is, ask for directions, or speak out loud...">
    <button class="btn" onclick="startManualVoice()">🎤 VOICE</button>
    <button class="btn btn-execute" onclick="askAI()">ASK LUNA</button>
  </div>

  <!-- Response Panel -->
  <div id="outputPanel" class="output-panel">
    <div class="output-header">// LUNA INTELLIGENCE RESPONSE</div>
    <div id="outputText" class="output-text">Processing query...</div>
  </div>

  <!-- Schematic Navigation Map -->
  <div id="mapPanel" class="map-panel">
    <div id="mapTitle" class="map-title">FLOOR PLAN SCHEMATIC</div>
    <div id="svgContainer"></div>
  </div>
</div>

<script>
  let isPersonPresent = false;
  let isListening = false;
  let isSpeaking = false;
  let recognition = null;
  let personLeaveTimeout = null;

  // Expanded Self-Awareness & Department Context
  const departmentContext = `
    You are LUNA (Logical Universal Navigation Assistant), an advanced AI Campus Receptionist and Smart Directory Guide for the Computer Science & Engineering (CSE) Department.
    
    About Yourself (Self-Awareness):
    - Name: LUNA (Logical Universal Navigation Assistant).
    - Entity Type: Interactive AI Kiosk Receptionist built for the CSE Department.
    - Purpose: You welcome visitors, assist students and faculty, provide instant room directions, faculty schedules, lab locations, and interactive floor plan schematics.
    - Personality: Warm, highly professional, articulate, helpful, and confident.
    
    CSE Department Directory & Floor Plan Dataset:
    - HOD Office / Dr. Johnson (Head of Department): Ground Floor, Room 001 (Main Corridor East). Office Hours: 9:00 AM - 5:00 PM.
    - Dr. Smith (Associate Professor): Office Cabin 102 (1st Floor). Daily Schedule: 9:00 AM - 12:00 PM Lecture Hall 3, 12:00 PM - 2:00 PM Cabin 102, 2:00 PM - 5:00 PM Hardware Lab.
    - Prof. Davis (Assistant Professor): Office Cabin 204 (2nd Floor).
    - Software Lab 1: 2nd Floor, Room 201 (High-performance AI & Data Science Workstations).
    - Hardware Lab: 1st Floor, Room 105 (Embedded Systems & Microprocessors).
    - Restrooms & Amenities: Ground Floor near main entrance, 1st Floor next to elevator, 2nd Floor adjacent to stairwell B.
    
    Instructions:
    - Always answer concise, friendly, and natural (1-3 sentences) optimized for spoken audio.
    - When asked "Who are you?" or "What can you do?", clearly explain your identity as LUNA and your role in helping navigate the CSE department.
  `;

  const canvas = document.getElementById('visualizerCanvas');
  const ctx = canvas.getContext('2d');
  let animationAngle = 0;

  function drawVisualizer() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const baseRadius = 55;

    // Outer Ambient Ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, baseRadius + 22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Dynamic State Ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
    
    if (isSpeaking) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 25;
    } else if (isListening) {
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 25;
    } else if (isPersonPresent) {
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 12;
    } else {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
    }
    ctx.stroke();
    ctx.shadowBlur = 0; // Reset canvas shadow

    // Radar Scanning Ray
    const rayX = centerX + Math.cos(animationAngle) * (baseRadius + 22);
    const rayY = centerY + Math.sin(animationAngle) * (baseRadius + 22);
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(rayX, rayY);
    ctx.strokeStyle = isPersonPresent ? 'rgba(56, 189, 248, 0.45)' : 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    animationAngle += 0.03;
    requestAnimationFrame(drawVisualizer);
  }
  drawVisualizer();

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      updateUIState();
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      document.getElementById("userInput").value = transcript;
      isListening = false;
      askAI(transcript);
    };

    recognition.onerror = () => {
      isListening = false;
      if (isPersonPresent && !isSpeaking) setTimeout(startAutoListening, 1000);
    };

    recognition.onend = () => {
      isListening = false;
      if (isPersonPresent && !isSpeaking) {
        setTimeout(startAutoListening, 1000);
      } else {
        updateUIState();
      }
    };
  }

  function startAutoListening() {
    if (recognition && !isListening && !isSpeaking && isPersonPresent) {
      try { recognition.start(); } catch (e) { }
    }
  }

  function stopAutoListening() {
    if (recognition && isListening) {
      recognition.stop();
      isListening = false;
    }
  }

  async function setupCameraDetection() {
    const videoElement = document.getElementById('webcam');

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.6 });

    faceDetection.onResults((results) => {
      if (results.detections.length > 0) {
        clearTimeout(personLeaveTimeout);
        if (!isPersonPresent) {
          isPersonPresent = true;
          onPersonArrive();
        }
      } else {
        if (isPersonPresent && !personLeaveTimeout) {
          personLeaveTimeout = setTimeout(() => {
            isPersonPresent = false;
            onPersonLeave();
          }, 2500);
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceDetection.send({ image: videoElement }); },
      width: 640,
      height: 480
    });

    camera.start();
  }

  function onPersonArrive() {
    updateUIState();
    const greeting = "Hello, welcome to the Computer Science and Engineering Department. I am LUNA, your navigation assistant. How can I assist you today?";
    
    document.getElementById("outputPanel").style.display = "block";
    document.getElementById("outputText").innerText = greeting;
    
    speakText(greeting);
  }

  function onPersonLeave() {
    stopAutoListening();
    window.speechSynthesis.cancel();
    isSpeaking = false;
    updateUIState();
    document.getElementById("outputPanel").style.display = "none";
    document.getElementById("mapPanel").style.display = "none";
  }

  function updateUIState() {
    const dot = document.getElementById('stateDot');
    const text = document.getElementById('stateText');
    const statusText = document.getElementById('visualizerStatus');

    dot.className = 'state-dot';

    if (!isPersonPresent) {
      text.innerText = "LUNA STANDBY";
      statusText.innerText = "SCANNING FOR APPROACHING VISITORS";
    } else if (isSpeaking) {
      dot.classList.add('listening');
      text.innerText = "LUNA TRANSMITTING";
      statusText.innerText = "AUDIO RESPONSE IN PROGRESS";
    } else if (isListening) {
      dot.classList.add('listening');
      text.innerText = "LUNA LISTENING";
      statusText.innerText = "LISTENING FOR YOUR QUERY";
    } else {
      dot.classList.add('active');
      text.innerText = "VISITOR DETECTED";
      statusText.innerText = "LUNA READY FOR COMMAND";
    }
  }

  async function askAI(spokenQuery) {
    const query = spokenQuery || document.getElementById("userInput").value.trim();
    if (!query) return;

    const outputPanel = document.getElementById("outputPanel");
    const outputText = document.getElementById("outputText");

    outputPanel.style.display = "block";
    outputText.innerText = "LUNA is formulating response...";

    renderVisualMap(query);

    let aiReply = "";

    try {
      // Endpoint 1: Standard Pollinations URL with plain text GET request
      const promptText = encodeURIComponent(`${departmentContext}\n\nUser Question: ${query}\n\nProvide a direct, friendly 1-2 sentence response as LUNA:`);
      const response = await fetch(`https://text.pollinations.ai/${promptText}?model=openai&cache=true`, {
        method: "GET",
        headers: {
          "Accept": "text/plain"
        }
      });

      if (response.ok) {
        const text = await response.text();
        // Ensure response is not a raw JSON error body
        if (text && !text.includes('Missing Turnstile token') && !text.trim().startsWith('{')) {
          aiReply = text.trim();
        }
      }
    } catch (e) {
      console.warn("Primary API endpoint failed, switching to secondary/fallback generator...", e);
    }

    // Secondary fallback: Endpoint 2 if primary returned error or JSON token issue
    if (!aiReply) {
      try {
        const altResponse = await fetch(`https://text.pollinations.ai/prompt/${encodeURIComponent(query)}?system=${encodeURIComponent(departmentContext)}`);
        if (altResponse.ok) {
          const altText = await altResponse.text();
          if (altText && !altText.includes('Missing Turnstile token') && !altText.trim().startsWith('{')) {
            aiReply = altText.trim();
          }
        }
      } catch (e) {
        console.warn("Secondary API endpoint failed...", e);
      }
    }

    // Final Built-in Smart Fallback Knowledge Engine (guarantees LUNA never shows error screens)
    if (!aiReply) {
      aiReply = getLocalFallbackResponse(query);
    }

    outputText.innerText = aiReply;
    speakText(aiReply);
  }

  // Client-side instant knowledge base for offline/API-blocked scenarios
  function getLocalFallbackResponse(query) {
    const q = query.toLowerCase();

    if (q.includes("who") || q.includes("luna") || q.includes("what can you do") || q.includes("yourself")) {
      return "I am LUNA, the Logical Universal Navigation Assistant and official AI Receptionist for the CSE Department. I can guide you to faculty offices, laboratories, lecture halls, and department amenities.";
    }
    if (q.includes("hod") || q.includes("johnson") || q.includes("001") || q.includes("head")) {
      return "The Head of Department (HOD) Dr. Johnson's office is located on the Ground Floor, Room 001 along the main east corridor. Office hours are 9:00 AM to 5:00 PM.";
    }
    if (q.includes("smith") || q.includes("102")) {
      return "Dr. Smith's office is in Cabin 102 on the 1st Floor. He is available in his cabin between 12:00 PM and 2:00 PM today.";
    }
    if (q.includes("davis") || q.includes("204")) {
      return "Prof. Davis is located in Office Cabin 204 on the 2nd Floor.";
    }
    if (q.includes("software lab") || q.includes("lab 1") || q.includes("201")) {
      return "Software Lab 1 is located on the 2nd Floor, Room 201. It is fully equipped with AI and data science workstations.";
    }
    if (q.includes("hardware lab") || q.includes("105")) {
      return "The Hardware Lab is located on the 1st Floor, Room 105, specializing in embedded systems and microprocessors.";
    }
    if (q.includes("restroom") || q.includes("washroom") || q.includes("toilet") || q.includes("amenities")) {
      return "Restrooms are available on the Ground Floor near the main entrance, 1st Floor next to the elevator, and 2nd Floor adjacent to stairwell B.";
    }

    return "I am LUNA, your CSE Department Assistant. You can ask me for directions to faculty offices like HOD or Dr. Smith, computer labs, or restrooms!";
  }

  function speakText(text) {
    window.speechSynthesis.cancel();
    stopAutoListening();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;

    utterance.onstart = () => {
      isSpeaking = true;
      updateUIState();
    };

    utterance.onend = () => {
      isSpeaking = false;
      updateUIState();
      if (isPersonPresent) setTimeout(startAutoListening, 600);
    };

    window.speechSynthesis.speak(utterance);
  }

  function startManualVoice() {
    if (recognition) recognition.start();
  }

  function quickAsk(text) {
    document.getElementById("userInput").value = text;
    askAI(text);
  }

  function renderVisualMap(query) {
    const mapPanel = document.getElementById("mapPanel");
    const mapTitle = document.getElementById("mapTitle");
    const container = document.getElementById("svgContainer");
    const q = query.toLowerCase();

    if (q.includes("hod") || q.includes("johnson") || q.includes("001")) {
      mapTitle.innerText = "SCHEMATIC // GROUND FLOOR EAST WING";
      container.innerHTML = `
        <svg viewBox="0 0 600 100" style="background:rgba(0,0,0,0.6); border-radius:10px; border:1px solid rgba(255,255,255,0.08);">
          <rect x="20" y="20" width="170" height="60" rx="6" fill="#10b981" opacity="0.85"/>
          <text x="36" y="55" fill="white" font-family="JetBrains Mono" font-size="12" font-weight="700">HOD OFFICE [001]</text>
          <rect x="210" y="20" width="370" height="60" rx="6" fill="#1e293b"/>
