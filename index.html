<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA — Autonomous Navigation Kiosk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #030712;
      --surface-glass: rgba(13, 17, 23, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.07) 0%, transparent 60%),
        linear-gradient(to bottom, #030712, #020617);
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .kiosk-shell {
      width: 100%;
      max-width: 900px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 20px;
    }

    .system-id {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .status-dot.active { background: var(--accent-emerald); box-shadow: 0 0 12px var(--accent-emerald); }
    .status-dot.listening { background: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); }

    .hero-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 10px;
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 60%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .orb-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .orb-button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .interaction-cue {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .input-box-container {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .query-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px 20px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .query-input:focus {
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      border-radius: 14px;
      color: var(--bg-deep);
      font-weight: 700;
      padding: 0 24px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    .send-btn:hover { opacity: 0.9; }

    .transcript-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px dashed var(--border-glass);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .transcript-box span {
      color: var(--accent-cyan);
      margin-left: 8px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .action-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-chip:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
    }

    .response-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 24px;
      display: none;
      text-align: left;
    }

    .card-header-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card-body-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    #webcam { display: none; }
  </style>
</head>
<body>

<div class="kiosk-shell">
  <div class="top-bar">
    <div class="system-id">// CSE DEPARTMENT KIOSK V4.1</div>
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">LUNA STANDBY</span>
    </div>
  </div>

  <div class="hero-block">
    <div class="brand-subtitle">Logical Universal Navigation Assistant</div>
    <h1 class="hero-title">LUNA</h1>
    
    <div class="orb-container" onclick="toggleManualVoice()">
      <div class="orb-button" id="micBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </div>
    </div>
    
    <div class="interaction-cue" id="radarStatusText">TAP ORB OR TYPE BELOW TO INTERACT</div>
  </div>

  <div class="input-box-container">
    <input type="text" id="queryInput" class="query-input" placeholder="Type visitor name or ask a question..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="submitTypedQuery()">Ask Luna</button>
  </div>

  <div class="transcript-box">
    Live Speech: <span id="liveTranscript">Waiting for speech...</span>
  </div>

  <div class="section-label">Simulate Different Persons Arriving</div>
  <div class="chip-grid">
    <button class="action-chip" onclick="simulateVisitor('Dr. Smith')"> Dr. Smith</button>
    <button class="action-chip" onclick="simulateVisitor('Nasreen Ali')"> Nasreen Ali</button>
    <button class="action-chip" onclick="simulateVisitor('Guest')"> General Guest</button>
  </div>

  <div class="section-label">Quick Actions</div>
  <div class="chip-grid">
    <button class="action-chip" onclick="quickAsk('Come to my house!')">Invite to Home</button>
    <button class="action-chip" onclick="quickAsk('HOD Office')">HOD Office</button>
    <button class="action-chip" onclick="quickAsk('Restrooms')">Restrooms</button>
  </div>

  <div class="response-card" id="outputPanel">
    <div class="card-header-label">// LUNA INTELLIGENCE RESPONSE</div>
    <div class="card-body-text" id="outputText"></div>
  </div>

  <video id="webcam" autoplay playsinline></video>
</div>

<!-- Load MediaPipe safely -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  let isPersonPresent = false;
  let isListening = false;
  let recognition = null;
  let absenceTimer = null; // Timer for the 4-second delay

  const creatorName = "Muhammed Jesin";
  const creatorBatch = "CSE S3 A Batch";

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
      let interimTranscript = '';
      let finalTranscript = '';

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript;
        } else {
          interimTranscript += e.results[i][0].transcript;
        }
      }

      const currentSpeech = finalTranscript || interimTranscript;
      document.getElementById('liveTranscript').innerText = currentSpeech;

      if (finalTranscript) {
        processQuery(finalTranscript.trim());
      }
    };

    recognition.onstart = () => { 
      isListening = true; 
      updateUIStatus(); 
      document.getElementById('liveTranscript').innerText = "Listening...";
    };
    recognition.onend = () => { isListening = false; updateUIStatus(); };
    recognition.onerror = () => { isListening = false; updateUIStatus(); };
  }

  function toggleManualVoice() {
    if (!recognition) return;
    if (isListening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      try { recognition.start(); } catch(e) {}
    }
  }

  function quickAsk(text) {
    document.getElementById('liveTranscript').innerText = `Selected: "${text}"`;
    processQuery(text);
  }

  function simulateVisitor(name) {
    document.getElementById('liveTranscript').innerText = `Visitor Arrived: ${name}`;
    onPersonArrive(name);
  }

  function submitTypedQuery() {
    const inputField = document.getElementById('queryInput');
    const queryText = inputField.value.trim();
    if (queryText) {
      document.getElementById('liveTranscript').innerText = `Typed: "${queryText}"`;
      processQuery(queryText);
      inputField.value = '';
    }
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      submitTypedQuery();
    }
  }

  async function setupCameraDetection() {
    if (typeof FaceDetection === 'undefined' || typeof Camera === 'undefined') {
      setTimeout(setupCameraDetection, 1000);
      return;
    }

    const videoElement = document.getElementById('webcam');
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.65 });

    faceDetection.onResults((results) => {
      if (results.detections.length > 0) {
        // Face is detected: clear any pending absence timeout immediately
        if (absenceTimer) {
          clearTimeout(absenceTimer);
          absenceTimer = null;
        }

        if (!isPersonPresent) {
          isPersonPresent = true;
          onPersonArrive('Guest'); 
        }
      } else {
        // Face is gone: start 4-second timeout before going to standby
        if (isPersonPresent && !absenceTimer) {
          absenceTimer = setTimeout(() => {
            isPersonPresent = false;
            onPersonLeave();
            absenceTimer = null;
          }, 4000); // 4000ms = 4 seconds
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceDetection.send({ image: videoElement }); },
      width: 640,
      height: 480
    });
    camera.start();
  }

  function onPersonArrive(visitorName = 'Guest') {
    updateUIStatus();
    
    let greeting = "";
    if (visitorName === 'Dr. Smith') {
      greeting = "Oh, hello! Welcome to the department, Dr. Smith! It is an absolute joy to have you here today!";
    } else if (visitorName === 'Nasreen Ali') {
      greeting = "Yay! Welcome, Nasreen Ali! Your favorite department assistant is so happy to see you!";
    } else {
      greeting = "Hi there! Welcome to the Computer Science Department! I am so thrilled to help you today!";
    }

    document.getElementById("outputPanel").style.display = "block";
    document.getElementById("outputText").innerText = greeting;
    speakText(greeting);
  }

  function onPersonLeave() {
    if (recognition && isListening) recognition.stop();
    window.speechSynthesis.cancel();
    updateUIStatus();
    document.getElementById("outputPanel").style.display = "none";
  }

  function updateUIStatus() {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const radarText = document.getElementById('radarStatusText');

    dot.className = 'status-dot';
    if (!isPersonPresent) {
      text.innerText = "LUNA STANDBY";
      radarText.innerText = "SCANNING FOR VISITORS";
    } else if (isListening) {
      dot.classList.add('listening');
      text.innerText = "LUNA LISTENING";
      radarText.innerText = "LISTENING... SPEAK NOW";
    } else {
      dot.classList.add('active');
      text.innerText = "VISITOR DETECTED";
      radarText.innerText = "TAP ORB OR TYPE TO SPEAK";
    }
  }

  function processQuery(query) {
    if (!query) return;
    window.speechSynthesis.cancel();
    
    const outputPanel = document.getElementById("outputPanel");
    const outputText = document.getElementById("outputText");
    outputPanel.style.display = "block";
    
    const q = query.toLowerCase();
    let reply = "";

    if (q.includes("invite") || q.includes("home") || q.includes("house") || q.includes("come over") || q.includes("visit")) {
      reply = "Aw, yay! Thank you so much for the sweet invitation! I would love to come over, but I'm having way too much fun welcoming everyone right here in the department!";
    } else if (q.includes("hello") || q.includes("hi ") || q.includes("hey")) {
      reply = "Hi! It is so wonderful to talk with you today! How can I make your experience amazing?";
    } else if (q.includes("who created") || q.includes("who built") || q.includes("creator")) {
      reply = `Woohoo! I was proudly created, built, and authored by ${creatorName} from ${creatorBatch}! Isn't that incredible?!`;
    } else if (q.includes("who is luna") || q.includes("what is luna")) {
      reply = `I am LUNA, your super-excited assistant built by ${creatorName} from ${creatorBatch} to help you navigate the department with a big smile!`;
    } else if (q.includes("nasreen") || q.includes("miss") || q.includes("ali") || q.includes("timetable") || q.includes("schedule")) {
      reply = "Nasreen Ali teaches Design and Analysis of Algorithms (PCCST502) and Algorithmic Thinking with Python (UCEST105P)! Her schedule includes awesome classes for S5 CSE A, S5 CSE B, and S7 CSE A!";
    } else if (q.includes("hod")) {
      reply = "The HOD Office is right on the Ground Floor, in Room 001!";
    } else if (q.includes("smith")) {
      reply = "Dr. Smith's office cabin is room 102, located on the 1st Floor!";
    } else if (q.includes("restroom")) {
      reply = "Restrooms are on the Ground Floor, right near the main entrance!";
    } else {
      reply = "I would love to help you with that! Feel free to ask me anything about faculty schedules, room numbers, or directions!";
    }

    outputText.innerText = reply;
    speakText(reply);
  }

  function speakText(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    
    utterance.rate = 1.2;  
    utterance.pitch = 1.5;  
    utterance.volume = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const femaleVoice = voices.find(v => 
      v.lang.startsWith('en') && (
        v.name.includes('Natural') || 
        v.name.includes('Online') || 
        v.name.includes('Google') || 
        v.name.includes('Zira') || 
        v.name.includes('Samantha') ||
        v.name.includes('Hazel')
      )
    ) || voices.find(v => v.lang.startsWith('en'));

    if (femaleVoice) {
      utterance.voice = femaleVoice;
    }

    window.speechSynthesis.speak(utterance);
  }

  if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
  }

  window.onload = () => {
    initSpeechRecognition();
    setupCameraDetection();
  };
</script>

</body>
</html>
