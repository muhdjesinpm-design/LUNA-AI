<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA — Autonomous Navigation Kiosk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.run/@google/genai"
    }
  }
  </script>
  <style>
    :root {
      --bg-deep: #020617;
      --surface-glass: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(56, 189, 248, 0.12);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-brand: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 20% 90%, rgba(129, 140, 248, 0.06) 0%, transparent 40%),
        linear-gradient(to bottom, #020617, #010409);
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .kiosk-shell {
      width: 100%;
      max-width: 920px;
      background: var(--surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 36px;
      padding: 52px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 20px;
    }

    .system-id {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.2px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-glass);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }
    .status-dot.active { background: var(--accent-emerald); box-shadow: 0 0 12px var(--accent-emerald); }
    .status-dot.listening { background: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); }

    .hero-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 5px;
      color: var(--accent-cyan);
      margin-bottom: 10px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .hero-title {
      font-family: var(--font-brand);
      font-size: 72px;
      font-weight: 800;
      letter-spacing: 14px;
      background: linear-gradient(135deg, #ffffff 10%, var(--accent-cyan) 50%, var(--accent-purple) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
      margin-left: 14px;
    }

    .orb-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.2s ease;
    }
    .orb-container:hover { transform: scale(1.05); }

    .orb-button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
    }

    .interaction-cue {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .input-box-container {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .query-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 16px 20px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    .query-input:focus {
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.12);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      border-radius: 16px;
      color: var(--bg-deep);
      font-weight: 700;
      padding: 0 26px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 14px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .send-btn:hover { opacity: 0.95; transform: translateY(-1px); }

    .transcript-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed var(--border-glass);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 28px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    .transcript-box span {
      color: var(--accent-cyan);
      margin-left: 8px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .action-chip {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-chip:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      transform: translateY(-1px);
    }

    .response-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 26px;
      display: none;
      text-align: left;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-header-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card-body-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-primary);
    }

    #webcam { display: none; }
  </style>
</head>
<body>

<div class="kiosk-shell">
  <div class="top-bar">
    <div class="system-id">// CSE DEPARTMENT KIOSK V4.1</div>
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">LUNA STANDBY</span>
    </div>
  </div>

  <div class="hero-block">
    <div class="brand-subtitle">Logical Universal Navigation Assistant</div>
    <h1 class="hero-title">LUNA</h1>
    
    <div class="orb-container" onclick="toggleManualVoice()">
      <div class="orb-button" id="micBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </div>
    </div>
    
    <div class="interaction-cue" id="radarStatusText">TAP ORB OR TYPE BELOW TO INTERACT</div>
  </div>

  <div class="input-box-container">
    <input type="text" id="queryInput" class="query-input" placeholder="Type visitor name or ask a question..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="submitTypedQuery()">Ask Luna</button>
  </div>

  <div class="transcript-box">
    Live Speech: <span id="liveTranscript">Waiting for speech...</span>
  </div>

  <div class="section-label">Simulate Different Persons Arriving</div>
  <div class="chip-grid">
    <button class="action-chip" onclick="simulateVisitor('Dr. Smith')"> Dr. Smith</button>
    <button class="action-chip" onclick="simulateVisitor('Nasreen Ali')"> Nasreen Miss</button>
    <button class="action-chip" onclick="simulateVisitor('Guest')"> General Guest</button>
  </div>

  <div class="section-label">Quick Actions</div>
  <div class="chip-grid">
    <button class="action-chip" onclick="quickAsk('Come to my house!')">Invite to Home</button>
    <button class="action-chip" onclick="quickAsk('HOD Office')">HOD Office</button>
    <button class="action-chip" onclick="quickAsk('Restrooms')">Restrooms</button>
  </div>

  <div class="response-card" id="outputPanel">
    <div class="card-header-label">// LUNA INTELLIGENCE RESPONSE</div>
    <div class="card-body-text" id="outputText"></div>
  </div>

  <video id="webcam" autoplay playsinline></video>
</div>

<!-- Load MediaPipe safely -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<!-- Main script block configured as a module to support GoogleGenAI SDK imports -->
<script type="module">
  import { GoogleGenAI } from "@google/genai";

  let isPersonPresent = false;
  let isListening = false;
  let recognition = null;
  let absenceTimer = null; 

  const creatorName = "Muhammed Jesin";
  const creatorBatch = "CSE S3 A Batch";

  window.initSpeechRecognition = function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
      let interimTranscript = '';
      let finalTranscript = '';

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript;
        } else {
          interimTranscript += e.results[i][0].transcript;
        }
      }

      const currentSpeech = finalTranscript || interimTranscript;
      document.getElementById('liveTranscript').innerText = currentSpeech;

      if (finalTranscript) {
        window.processQuery(finalTranscript.trim());
      }
    };

    recognition.onstart = () => { 
      isListening = true; 
      window.updateUIStatus(); 
      document.getElementById('liveTranscript').innerText = "Listening...";
    };
    recognition.onend = () => { isListening = false; window.updateUIStatus(); };
    recognition.onerror = () => { isListening = false; window.updateUIStatus(); };
  }

  window.toggleManualVoice = function() {
    if (!recognition) return;
    if (isListening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      try { recognition.start(); } catch(e) {}
    }
  }

  window.quickAsk = function(text) {
    document.getElementById('liveTranscript').innerText = `Selected: "${text}"`;
    window.processQuery(text);
  }

  window.simulateVisitor = function(name) {
    document.getElementById('liveTranscript').innerText = `Visitor Arrived: ${name}`;
    window.onPersonArrive(name);
  }

  window.submitTypedQuery = function() {
    const inputField = document.getElementById('queryInput');
    const queryText = inputField.value.trim();
    if (queryText) {
      document.getElementById('liveTranscript').innerText = `Typed: "${queryText}"`;
      window.processQuery(queryText);
      inputField.value = '';
    }
  }

  window.handleKeyPress = function(e) {
    if (e.key === 'Enter') {
      window.submitTypedQuery();
    }
  }

  window.setupCameraDetection = async function() {
    if (typeof FaceDetection === 'undefined' || typeof Camera === 'undefined') {
      setTimeout(window.setupCameraDetection, 1000);
      return;
    }

    const videoElement = document.getElementById('webcam');
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.65 });

    faceDetection.onResults((results) => {
      if (results.detections.length > 0) {
        if (absenceTimer) {
          clearTimeout(absenceTimer);
          absenceTimer = null;
        }

        if (!isPersonPresent) {
          isPersonPresent = true;
          window.onPersonArrive('Guest'); 
        }
      } else {
        if (isPersonPresent && !absenceTimer) {
          absenceTimer = setTimeout(() => {
            isPersonPresent = false;
            window.onPersonLeave();
            absenceTimer = null;
          }, 4000); 
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceDetection.send({ image: videoElement }); },
      width: 640,
      height: 480
    });
    camera.start();
  }

  window.onPersonArrive = function(visitorName = 'Guest') {
    window.updateUIStatus();
    
    let greeting = "";
    if (visitorName === 'Dr. Smith') {
      greeting = "Oh, hello! Welcome to the department, Dr. Smith! It is an absolute joy to have you here today!";
    } else if (visitorName === 'Nasreen Ali') {
      greeting = "Yay! Welcome, Nasreen Ali! Your favorite department assistant is so happy to see you!";
    } else {
      greeting = "Hi there! Welcome to the Computer Science Department! I am so thrilled to help you today!";
    }

    document.getElementById("outputPanel").style.display = "block";
    document.getElementById("outputText").innerText = greeting;
    window.speakText(greeting);
  }

  window.onPersonLeave = function() {
    if (recognition && isListening) recognition.stop();
    window.speechSynthesis.cancel();
    window.updateUIStatus();
    document.getElementById("outputPanel").style.display = "none";
  }

  window.updateUIStatus = function() {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const radarText = document.getElementById('radarStatusText');

    dot.className = 'status-dot';
    if (!isPersonPresent) {
      text.innerText = "LUNA STANDBY";
      radarText.innerText = "SCANNING FOR VISITORS";
    } else if (isListening) {
      dot.classList.add('listening');
      text.innerText = "LUNA LISTENING";
      radarText.innerText = "LISTENING... SPEAK NOW";
    } else {
      dot.classList.add('active');
      text.innerText = "VISITOR DETECTED";
      radarText.innerText = "TAP ORB OR TYPE TO SPEAK";
    }
  }

  window.processQuery = async function(query) {
    if (!query) return;
    window.speechSynthesis.cancel();
    
    const outputPanel = document.getElementById("outputPanel");
    const outputText = document.getElementById("outputText");
    outputPanel.style.display = "block";
    outputText.innerText = "Luna is thinking...";

    try {
      // Try Cloud API first
      
      const ai = new GoogleGenAI({ apiKey: apiKey });

      const promptText = `You are LUNA, a super-friendly, enthusiastic autonomous department assistant for a Computer Science department. You were created by Muhammed Jesin from CSE S3 A Batch. Keep your answers concise, warm, energetic, and helpful for department visitors. User query: "${query}"`;

      const response = await ai.models.generateContent({
        model: 'gemini-1.5-flash',
        contents: promptText,
      });

      const reply = response.text || "I'm here to help you navigate the department!";
      outputText.innerText = reply;
      window.speakText(reply);

    } catch (error) {
      console.warn("Cloud restricted, activating infinite local matrix...");
      
      const q = query.toLowerCase();
      let matchedReply = "";

      // 1. EMOTIONAL & MOOD HANDLING (Sad, happy, tired, bored)
      if (q.includes("sad") || q.includes("cry") || q.includes("depressed") || q.includes("down") || q.includes("unhappy")) {
        const responses = [
          "Oh no! Sending you the biggest virtual hug. Remember that tough times never last, but tough computer scientists do!",
          "I'm so sorry you're feeling down. Would you like to hear a funny programming joke to cheer you up?",
          "Cheer up! Even syntax errors get fixed in the end. You've got this!"
        ];
        matchedReply = responses[Math.floor(Math.random() * responses.length)];
      } 
      // 2. CASUAL TALK / ESCAPING DEPARTMENT TOPICS ("talk about anything else")
      else if (q.includes("anything else") || q.includes("not want to") || q.includes("don't have mood") || q.includes("random") || q.includes("fun")) {
        const responses = [
          "I completely understand! Sometimes you just need a break from tech. Did you know I love stargazing through virtual telescopes in my free time?",
          "Got it! Let's talk about something totally unrelated. What's your favorite hobby outside of college?",
          "Fair enough! Let's switch gears. If you could teleport anywhere in the universe right now, where would you go?",
          "No department talk, I promise! Let's chat about music, movies, or whatever is on your mind."
        ];
        matchedReply = responses[Math.floor(Math.random() * responses.length)];
      }
      // 3. DEPARTMENT & NAVIGATION (HOD, Labs, Restrooms)
      else if (q.includes("hod") || q.includes("head") || q.includes("office")) {
        matchedReply = "The HOD Office is located on the first floor, right down the main corridor next to the staff room!";
      } else if (q.includes("restroom") || q.includes("washroom") || q.includes("toilet") || q.includes("bathroom")) {
        matchedReply = "The restrooms are located near the southern wing elevator on this floor.";
      } else if (q.includes("lab") || q.includes("computer")) {
        matchedReply = "Our high-performance computer labs are on the second floor, packed with great workstations!";
      }
      // 4. CREATOR INFO
      else if (q.includes("muhammed") || q.includes("jesin") || q.includes("creator") || q.includes("developer")) {
        matchedReply = "I was proudly built and coded by Muhammed Jesin from the CSE S3 A Batch!";
      }
      // 5. JOKES MATRIX
      else if (q.includes("joke") || q.includes("laugh")) {
        const jokes = [
          "Why do programmers prefer dark mode? Because light attracts bugs!",
          "Why do Java developers wear glasses? Because they don't C#!",
          "There are 10 types of people in the world: those who understand binary, and those who don't."
        ];
        matchedReply = jokes[Math.floor(Math.random() * jokes.length)];
      }
      // 6. INFINITE FALLBACK POOL (Generates a varied response even for unknown inputs)
      else {
        const fallbacks = [
          `I hear you loud and clear regarding "${query}". As Luna, your CSE guide, I'm always here to chat about it or help you find your way around!`,
          `That's a fascinating point about "${query}"! While I'm built for the CSE department, I love learning new things from visitors like you.`,
          `Hmm, "${query}" sounds intriguing! Tell me more about what's on your mind.`
        ];
        matchedReply = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      }

      outputText.innerText = matchedReply;
      window.speakText(matchedReply);
    }
  }
  window.speakText = function(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    
    utterance.rate = 1.2;  
    utterance.pitch = 1.5;  
    utterance.volume = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const femaleVoice = voices.find(v => 
      v.lang.startsWith('en') && (
        v.name.includes('Natural') || 
        v.name.includes('Online') || 
        v.name.includes('Google') || 
        v.name.includes('Zira') || 
        v.name.includes('Samantha') ||
        v.name.includes('Hazel')
      )
    ) || voices.find(v => v.lang.startsWith('en'));

    if (femaleVoice) {
      utterance.voice = femaleVoice;
    }

    window.speechSynthesis.speak(utterance);
  }

  if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
  }

  window.onload = () => {
    window.initSpeechRecognition();
    window.setupCameraDetection();
  };
</script>

</body>
</html>
